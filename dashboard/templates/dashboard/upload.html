<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Импорт данных</title>
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 700px;">
    <h1 class="mb-4">Импорт данных</h1>

    <div class="card shadow-sm">
        <div class="card-body p-4">
            <p class="text-muted">
                Выберите участок и соответствующий Excel-файл.
            </p>

            {% for message in messages %}
                <div class="alert alert-{{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}

            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">
                        {{ form.data_type.label }}
                    </label>
                    {{ form.data_type }}
                </div>

                <div class="mb-3">
                    <label class="form-label">
                        {{ form.file.label }}
                    </label>
                    {{ form.file }}
                </div>

                <button type="submit" class="btn btn-primary">
                    Загрузить данные
                </button>
            </form>
        </div>
    </div>
</div>

<script>
    document.querySelectorAll("select, input[type=file]").forEach(
        element => element.classList.add("form-control")
    );
    document.querySelector("select").classList.add("form-select");
</script>
</body>
</html>
